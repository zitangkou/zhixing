server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location = /shenlun {
        return 301 /shenlun/;
    }

    location ^~ /shenlun/ {
        try_files $uri $uri/ /shenlun/index.html;
    }

    location = /theory {
        return 301 /theory/;
    }

    location ^~ /theory/ {
        try_files $uri $uri/ /theory/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 用户上传的头像/错题图/录音等（Docker 卷挂载在 /app/server/data）
    location /uploads/ {
        alias /app/server/data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /manage {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8000;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
    }
}
