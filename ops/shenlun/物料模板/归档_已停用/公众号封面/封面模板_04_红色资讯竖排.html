<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>04_红色资讯竖排</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#e8e8e8;display:flex;align-items:center;justify-content:center;min-height:100vh;
        font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .cover{width:900px;height:383px;position:relative;overflow:hidden;color:#fff;}
  
.cover{background:#c40f17;}
.side{position:absolute;left:0;top:0;width:90px;height:100%;background:#8f0f0f;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.side span{writing-mode:vertical-rl;letter-spacing:8px;font-size:18px;font-weight:800;color:#FFD9A0;}
.issue{font-size:12px;color:#fff;}
.main{position:absolute;left:150px;right:40px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;}
h1{font-size:40px;font-weight:800;line-height:1.3;}
.topic{margin-top:16px;display:inline-block;background:#fff;color:#c40f17;font-size:14px;font-weight:700;
       padding:6px 14px;border-radius:4px;align-self:flex-start;}
.footer{position:absolute;right:40px;bottom:22px;font-size:12px;color:#F0C6C6;letter-spacing:1px;}

</style>
</head>
<body><div class="cover">
<div class="side"><span>时评精拆</span><span class="issue">第 12 期</span></div>
<div class="main"><h1>从“一件事”到“一类事”</h1><span class="topic">适用申论 · 基层治理主题</span></div>
<div class="footer">人民日报 2026-08-28</div>
</div></body>
</html>
