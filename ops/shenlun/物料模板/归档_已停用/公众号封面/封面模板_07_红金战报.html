<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>07_红金战报</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#e8e8e8;display:flex;align-items:center;justify-content:center;min-height:100vh;
        font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .cover{width:900px;height:383px;position:relative;overflow:hidden;color:#fff;}
  
.cover{background:linear-gradient(160deg,#D0021B 0%,#a80115 60%,#7d000b 100%);}
.stripes{position:absolute;right:-30px;top:0;width:120px;height:100%;
         background:repeating-linear-gradient(45deg,rgba(255,217,160,.12) 0 18px,transparent 18px 36px);}
.seal{position:absolute;right:46px;bottom:30px;width:70px;height:70px;border:3px solid #FFD9A0;
      border-radius:8px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);}
.seal span{font-size:14px;font-weight:800;color:#FFD9A0;letter-spacing:2px;writing-mode:vertical-rl;}
.main{padding:44px 60px 0;text-align:center;}
.kicker{font-size:15px;color:#FFD9A0;letter-spacing:4px;}
h1{font-size:44px;font-weight:900;margin-top:14px;letter-spacing:2px;}
.topic{display:inline-block;margin-top:16px;font-size:15px;color:#fff;background:rgba(255,255,255,.14);
       padding:6px 18px;border-radius:4px;}
.footer{position:absolute;left:60px;bottom:28px;font-size:12px;color:#FFE0C2;letter-spacing:1px;}

</style>
</head>
<body><div class="cover">
<div class="stripes"></div>
<div class="main"><div class="kicker">时评精拆 · 第 12 期</div><h1>从“一件事”到“一类事”</h1><span class="topic">适用申论 · 基层治理主题</span></div>

<div class="footer">人民日报 2026-08-28</div>
</div></body>
</html>
