# 知行公考 · 宿主机 Nginx HTTPS 网关（备案与域名启用后使用）
#
# 适用：正式域名上线；本项目容器改为监听 127.0.0.1:8081，
#       公网 80/443 由宿主机 Nginx 统一入口并负责证书。
#
# 使用：
#   cp deploy/nginx.conf /etc/nginx/sites-available/zhixing-gongkao
#   ln -sf /etc/nginx/sites-available/zhixing-gongkao /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# 注意：代理目标端口必须与 .env 的 HTTP_PORT 一致（默认 8081）。
#       HTTPS：certbot --nginx -d zhixinggk.ltd 即可自动补证书并跳转。

server {
    listen 80;
    server_name zhixinggk.ltd;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # H5 静态页面（容器内 nginx 负责 try_files）
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 学员端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # 管理端 API（JWT + RBAC）
    location /admin/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 管理后台静态页（FastAPI 挂载 server/admin-dist）
    location /manage/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件（头像 / 错题图，容器内直接 alias data/uploads）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查（小程序与容器 healthcheck 使用）
    # 注意：/docs 与 /openapi.json 刻意不对公网暴露——它们会公开全部
    #       /api 与 /admin 接口清单。需要查看时：
    #   1) 本地开发直接访问后端端口 http://127.0.0.1:8001/docs；
    #   2) 生产临时开隧道 ssh -L 8001:127.0.0.1:8001 <server>；
    #   3) 或临时取消下方注释块并加 IP 白名单（allow/deny）。
    location = /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    # location ~ ^/(docs|openapi\.json)$ {
    #     allow 你的办公网 IP;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8081;
    #     proxy_set_header Host $host;
    # }
}
